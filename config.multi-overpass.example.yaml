# WaterColorMap Multi-Server Overpass Configuration Example
# This demonstrates how to configure multiple Overpass API servers with
# geographic routing.
#
# Both `serve` and `generate` honour this block — they build their datasource
# through the same code path, so a bulk run routes per tile just as the server
# does. See config.example.yaml for the remaining settings.

# Data source configuration
data-source: "overpass"

# Output settings
output-dir: "./tiles"

# Logging
verbose: false
log-level: "info"

# Multi-server Overpass API configuration
# Servers are checked in order; the first matching coverage area is used.
# Always include a fallback server with no coverage area at the end.
overpass:
  # Identifies this client to every server below. Optional; a sensible default
  # naming the project is built in. Individual servers may override it.
  #
  # overpass-api.de rejects Go's stdlib default User-Agent with 406, so sending
  # a real one is what makes the public fallback below work at all.
  # user_agent: "MyProject/1.0 (+https://example.org/contact)"

  servers:
    # Local Niedersachsen instance (fast, covers Lower Saxony, Germany)
    - name: "Niedersachsen"
      endpoint: "http://localhost:12345/api/interpreter"
      workers: 10 # Higher parallelism for local instance
      # Per-server override, e.g. to tell your own traffic apart in the
      # instance's own access log.
      # user_agent: "MyProject/1.0 (local)"
      coverage:
        min_lat: 51.3 # Southern edge of Niedersachsen
        max_lat: 53.9 # Northern edge (includes coastal areas)
        min_lon: 6.6 # Western edge
        max_lon: 11.6 # Eastern edge

    # Public Overpass instance (fallback for rest of world)
    - name: "Public"
      endpoint: "https://overpass-api.de/api/interpreter"
      workers: 2 # Conservative for public API
      # No coverage specified = matches everything

# Alternative: single-server configuration. Remove overpass.servers above and
# uncomment this to have `serve` use one endpoint.
# overpass:
#   endpoint: "https://overpass-api.de/api/interpreter"

# Geographic coverage notes:
# - Niedersachsen (Lower Saxony): 51.3°N to 53.9°N, 6.6°E to 11.6°E
#   Covers: Hannover, Braunschweig, Osnabrück, Oldenburg, Göttingen, Wolfsburg
# - For other regions, add additional server entries with their coverage areas
# - Coverage areas can overlap; the first match is tried first
# - At least one server should have no coverage (fallback)
#
# Failover: when a matching server fails, the next matching one is tried, so a
# restarting local container no longer fails every tile in its coverage box.
# Two failures are deliberately NOT retried elsewhere, because another server
# would not help: a cancelled or timed-out context (the caller is gone), and a
# response over the size cap (a property of the data, not the server).
#
# Ordering still matters. A coverage box fully inside an earlier server's box is
# only ever reached when that earlier server fails, so list the most specific
# box first and the no-coverage fallback last. Startup logs a warning if it
# finds a box that can never be selected first.
