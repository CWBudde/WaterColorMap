name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install formatters and linters
        run: |
          just setup-deps

      - name: Install treefmt
        env:
          TREEFMT_VERSION: 2.5.0
        run: |
          curl -fsSL -o /tmp/treefmt.tar.gz \
            "https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}/treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/treefmt.tar.gz -C /tmp treefmt
          sudo install -m 0755 /tmp/treefmt /usr/local/bin/treefmt
          treefmt --version

      - name: Run treefmt
        run: |
          just check-formatted
