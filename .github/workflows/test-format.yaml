name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: Install formatters and linters
        run: |
          just setup-deps

      # check-formatted runs treefmt WITHOUT --allow-missing-formatter, so every
      # formatter configured in treefmt.toml must actually be present here --
      # otherwise the job silently skips it and enforces nothing. Versions are
      # pinned because formatter output differs between releases.
      - name: Install prettier and taplo
        run: |
          npm install -g prettier@3.8.0 @taplo/cli@0.7.0

      - name: Verify every configured formatter is present
        run: |
          for f in prettier taplo gci shellcheck shfmt; do
            command -v "$f" >/dev/null 2>&1 || { echo "missing formatter: $f"; exit 1; }
            echo "$f -> $(command -v "$f")"
          done

      - name: Install treefmt
        env:
          TREEFMT_VERSION: 2.5.0
        run: |
          curl -fsSL -o /tmp/treefmt.tar.gz \
            "https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}/treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/treefmt.tar.gz -C /tmp treefmt
          sudo install -m 0755 /tmp/treefmt /usr/local/bin/treefmt
          treefmt --version

      - name: Run treefmt
        run: |
          just check-formatted
