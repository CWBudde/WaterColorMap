# WaterColorMap Configuration Example
# Copy this to config.yaml and adjust as needed.
#
# Key naming: top-level keys use the hyphenated flag spelling (data-source,
# output-dir, log-level), while every key inside the per-command sections uses
# UNDERSCORES, even though the matching CLI flag is hyphenated:
#   --zoom-min  ->  generate.zoom_min
#   --tiles-dir ->  serve.tiles_dir
#   --input-dir ->  convert.input_dir
#
# Precedence: CLI flag > config file > built-in default. The per-command
# sections below are commented out so a fresh copy of this file changes
# nothing; uncomment only the keys you actually want to pin.

# Data source for OSM data. "overpass" is the only implemented source.
data-source: "overpass"

# Default output directory for generated tiles (also the fallback for
# serve.tiles_dir).
output-dir: "./tiles"

# Logging
verbose: false
log-level: "info" # debug, info, warn, error

# Overpass API endpoint.
#
# Honoured by both `serve` and `generate`: both build their data source through
# the same code path. For geographic routing across several Overpass servers,
# see config.multi-overpass.example.yaml.
overpass:
  endpoint: "https://overpass-api.de/api/interpreter"

# On-disk cache for Overpass responses.
#
# Entries are the raw upstream JSON, gzipped, keyed by endpoint + query text —
# so nothing about tile identity enters the key, and a re-render, a resumed
# batch run or a `--hidpi` pass reuses the data it already fetched instead of
# asking Overpass again. Shared by `serve` and `generate`.
#
# Off by default, deliberately: it changes freshness semantics (a re-run can
# render week-old OSM data) and spends gigabytes of disk. A corrupt or
# unreadable entry is always treated as a miss, never as a failed render.
#
# cache:
#   enabled: false
#   # Matches the ./cache directory the Docker container already mounts.
#   dir: "cache/overpass"
#   # Entry lifetime, measured from the file mtime. Default: 168h (7 days).
#   ttl: "168h"
#   # On-disk budget. Oldest entries are evicted first. Default: 5GB.
#   max-size: "5GB"
#   # Cache responses that contain zero elements too. Off by default: a 200 with
#   # no data is also what a silent Overpass failure looks like, and storing it
#   # would freeze that failure into every later run of the same tile.
#   store-empty: false

# Ocean / coastline rendering.
#
# OSM has no ocean polygons — the sea is modelled as the absence of land — so
# without this block the open sea renders as land and coastal tiles come out
# inverted. The data is the processed water polygons from
# https://osmdata.openstreetmap.de/data/water-polygons.html; run
# `just fetch-water-polygons` to download and index them into ./data.
#
# Leave the whole block out to disable ocean rendering; tiles then render
# exactly as they did before. Configured paths are checked at startup.
#
# ocean:
#   enabled: true
#   # Full detail, used above simplified-max-zoom (~800 MB on disk).
#   shapefile: "./data/water-polygons/water-polygons-split-3857/water_polygons.shp"
#   # Simplified, used up to and including simplified-max-zoom (~120 MB).
#   simplified-shapefile: "./data/water-polygons/simplified-water-polygons-split-3857/simplified_water_polygons.shp"
#   # Last zoom served from the simplified set. Default: 9.
#   simplified-max-zoom: 9

# --- generate --------------------------------------------------------------
# Values shown are the built-in defaults.
# generate:
#   # Single-tile mode (used when bbox is empty)
#   zoom: 13
#   x: 0
#   y: 0
#
#   # Batch mode: set bbox to "minLon,minLat,maxLon,maxLat" to enable it.
#   bbox: ""
#   zoom_min: 0 # required (> 0) for batch mode
#   zoom_max: 0 # required (> 0) for batch mode
#   workers: 0 # 0 = one worker per CPU
#   progress: true
#   allow_failures: false # keep going when individual tiles fail
#
#   # Rendering
#   force: false # regenerate even if the tile already exists
#   tile_size: 256 # 512 for Hi-DPI base tiles
#   hidpi: false # additionally render @2x tiles
#   png_compression: "default" # default, speed, best, none
#   seed: 1337 # deterministic noise/texture alignment
#   keep_layers: false # keep intermediate layer PNGs for debugging
#
#   # Band fetching: one Overpass query per block of tiles instead of one per
#   # tile. `out geom` returns unclipped geometry, so a motorway crossing a 4x4
#   # block is transferred 16 times by per-tile fetching; one query transfers it
#   # once. The fetch is ~71% of per-tile wall clock, so this is where a bulk
#   # run's time actually is.
#   #
#   # Off by default, deliberately: it changes the shape and size of the queries
#   # sent upstream, which anyone running against a shared or rate-limited
#   # Overpass has to opt into. Output is unaffected -- a band-fetched tile
#   # renders byte-identically to a per-tile one, which is pinned by
#   # TestBandFetchRendersIdenticalTiles.
#   band_fetch: false
#   # Band size in zoom levels above the tile: 1 = 2x2, 2 = 4x4, 3 = 8x8.
#   # 4x4 is the default because a band's response scales with area: one padded
#   # z13 tile measured ~3 MB, so an 8x8 block would land past the 64 MiB
#   # response cap and past any sensible server-side timeout.
#   band_level: 2
#   # Below this zoom, fetch per tile. A single low-zoom tile already covers a
#   # huge area, so banding buys little and risks a lot.
#   band_min_zoom: 10
#   # How many bands may be fetched ahead of rendering. This is what bounds how
#   # much band geometry is held in memory at once.
#   band_fetch_ahead: 1
#   # Server-side Overpass timeout for a band query, in seconds. Per-tile
#   # queries keep their own 60s and are byte-identical to what they always were.
#   band_timeout: 180
#
#   # Output
#   format: "folder" # folder or mbtiles
#   output_file: "" # required for format: mbtiles
#   # folder_structure: flat = z{z}_x{x}_y{y}.png, nested = {z}/{x}/{y}.png
#   folder_structure: "flat"

# --- serve -----------------------------------------------------------------
# serve:
#   addr: "127.0.0.1:8080"
#   tiles_dir: "" # empty = use output-dir
#   demo_dir: "docs/leaflet-demo"
#   mbtiles: "" # serve from an MBTiles file instead of tiles_dir
#
#   # On-demand generation
#   generate_missing: true
#   disable_cache: false # always re-render, still writes to disk
#   # Defaults to the CPU count, which cannot be written as a literal here:
#   # uncommenting this key replaces that default outright, and any value <= 0
#   # is clamped to 1 (internal/server/ondemand_tiles.go), serialising rendering.
#   max_concurrent_generations: 8
#   generation_timeout: "2m"
#   cache_control: "no-store"
#   max_pending_generations: 0 # 0 = auto; excess requests get 503
#
#   # Rendering (same meaning as under generate)
#   tile_size: 256
#   png_compression: "default"
#   seed: 1337
#   keep_layers: false
#
#   # Data fetching
#   overpass_workers: 4 # 2-4 is polite for the public API
#   fetch_workers: 2
#   data_size_warning_mb: 10
#
#   # Per-client rate limiting on /tiles/
#   tile_rate_limit: 20 # requests per second, 0 disables
#   tile_rate_burst: 400
#   tile_rate_ttl: "10m" # idle time before a client entry is evicted
#   tile_rate_max_entries: 20000
#   trusted_proxies: "" # CIDRs whose X-Forwarded-For is trusted
#
#   shutdown_timeout: "30s"

# --- convert (tile folder -> MBTiles) --------------------------------------
# convert:
#   input_dir: "./tiles"
#   output: "" # required: path of the .mbtiles file to write
#   name: "WaterColorMap"
#   description: "Watercolor-styled map tiles"
#   attribution: "© OpenStreetMap contributors"
#   bounds: "" # optional "minLon,minLat,maxLon,maxLat" for the metadata

# --- textures (generate the seamless watercolor textures) ------------------
# textures:
#   dir: "assets/textures"
#   size: 1024 # pixels, square
#   seed: 1337
#   variation: 1.0 # 0..1
#   brushness: 1.0 # 0..1, brush stroke strength
#   force: false # overwrite existing textures

# Watercolor tuning (optional).
#
# This block is commented out on purpose: with no `watercolor:` key present the
# renderer uses DefaultParams verbatim, with no arithmetic in between, which is
# what keeps the golden images stable. Uncommenting a key overrides exactly that
# key; everything else keeps its default.
#
# All lengths below are in pixels at the 256px reference tile size. They are
# scaled automatically for larger tiles (@2x renders at scale 2), so do not
# double them by hand.
#
# Unknown keys and unknown layer names are startup errors, not silent no-ops.
# See docs/watercolor-tuning.md for what each knob does and the order they
# apply in.
#
# watercolor:
#   defaults:
#     blur-sigma: 2.45       # mask blur before threshold; the main softness knob
#     antialias-sigma: 1.41  # final edge smoothing after threshold
#     noise-scale: 30.0      # Perlin feature size in px; larger = coarser grain
#     noise-strength: 0.28   # 0..1, how far noise displaces the mask
#     threshold: 50          # 0..255, global cutoff turning the blurred mask binary
#
#   layers:
#     # Valid layer names: land, water, rivers, parks, urban, civic,
#     # buildings, roads, railroads, highways.
#     water:
#       mask-threshold: 144        # per-layer override of `threshold`
#       mask-blur-sigma: 2.45      # omit to inherit defaults.blur-sigma (0 is NOT "no blur")
#       mask-noise-strength: 0.18  # omit to inherit defaults.noise-strength
#       adaptive-noise: true       # scale noise by distance from the edge
#       noise-min-dist: 2.0        # px from edge below which noise is minimal
#       noise-max-dist: 10.0       # px from edge above which noise is at full strength
#       edge-strength: 0.2         # 0..1, darkness of the edge halo (0 disables it)
#       edge-sigma: 3.5            # px; the halo radius is edge-sigma * 3
#       edge-gamma: 9.3            # falloff steepness; higher = tighter halo
#       shade-sigma: 0             # px; broad interior shading (land only, by default)
#       shade-strength: 0          # 0..1
#       invert-mask: false         # land is the only layer that inverts by default
#       tint:
#         color: "#8ab4c8"         # recolours this layer's paper texture
#         strength: 0.25           # 0..1; 0 is untinted, 1 is flat colour

# Not configurable: the layer set (water, rivers, land, parks, urban, civic,
# buildings, roads, railroads, highways, paper) and the texture used for each
# layer are hard-coded in the renderer, as are the fallback colours. Change
# them by editing assets/styles and assets/textures, not this file.
