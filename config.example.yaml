# WaterColorMap Configuration Example
# Copy this to config.yaml and adjust as needed

# Data source configuration
data-source: "overpass" # Options: overpass, protomaps, openmaptiles

# Output settings
output-dir: "./tiles"

# Verbose logging
verbose: false

# Overpass API settings
overpass:
  endpoint: "https://overpass-api.de/api/interpreter"
  timeout: 30s
  rate-limit: 2 # requests per second
  retry:
    max-attempts: 3
    backoff: 2s

# Tile generation settings
tile:
  # Image format settings
  width: 256
  height: 256
  format: "png"

  # Rendering settings
  dpi: 96

  # Caching
  cache-enabled: true
  cache-dir: "./cache"

# Test area - Hanover, Germany
test-area:
  name: "Hanover"
  center:
    lat: 52.3759
    lon: 9.7320
  zoom-range:
    min: 10
    max: 16

  # Example test tile
  test-tile:
    zoom: 13
    x: 4299
    y: 2740

# Feature rendering configuration
rendering:
  # Watercolor texture settings
  textures:
    path: "./assets/textures"
    water: "water.png"
    land: "land.png"
    park: "park.png"
    forest: "forest.png"

  # Layer order (bottom to top)
  layers:
    - water
    - land
    - parks
    - forests
    - roads
    - buildings

  # Color schemes (fallback if textures not available)
  colors:
    water: "#a5bfdd"
    land: "#f2efe9"
    park: "#c8e6c9"
    forest: "#81c784"
    road: "#ffffff"
    building: "#e0e0e0"

# Watercolor tuning (optional).
#
# This block is commented out on purpose: with no `watercolor:` key present the
# renderer uses DefaultParams verbatim, with no arithmetic in between, which is
# what keeps the golden images stable. Uncommenting a key overrides exactly that
# key; everything else keeps its default.
#
# All lengths below are in pixels at the 256px reference tile size. They are
# scaled automatically for larger tiles (@2x renders at scale 2), so do not
# double them by hand.
#
# Unknown keys and unknown layer names are startup errors, not silent no-ops.
# See docs/watercolor-tuning.md for what each knob does and the order they
# apply in.
#
# watercolor:
#   defaults:
#     blur-sigma: 2.45       # mask blur before threshold; the main softness knob
#     antialias-sigma: 1.41  # final edge smoothing after threshold
#     noise-scale: 30.0      # Perlin feature size in px; larger = coarser grain
#     noise-strength: 0.28   # 0..1, how far noise displaces the mask
#     threshold: 50          # 0..255, global cutoff turning the blurred mask binary
#
#   layers:
#     # Valid layer names: land, water, rivers, parks, urban, civic,
#     # buildings, roads, railroads, highways.
#     water:
#       mask-threshold: 144        # per-layer override of `threshold`
#       mask-blur-sigma: 2.45      # omit to inherit defaults.blur-sigma (0 is NOT "no blur")
#       mask-noise-strength: 0.18  # omit to inherit defaults.noise-strength
#       adaptive-noise: true       # scale noise by distance from the edge
#       noise-min-dist: 2.0        # px from edge below which noise is minimal
#       noise-max-dist: 10.0       # px from edge above which noise is at full strength
#       edge-strength: 0.2         # 0..1, darkness of the edge halo (0 disables it)
#       edge-sigma: 3.5            # px; the halo radius is edge-sigma * 3
#       edge-gamma: 9.3            # falloff steepness; higher = tighter halo
#       shade-sigma: 0             # px; broad interior shading (land only, by default)
#       shade-strength: 0          # 0..1
#       invert-mask: false         # land is the only layer that inverts by default
#       tint:
#         color: "#8ab4c8"         # recolours this layer's paper texture
#         strength: 0.25           # 0..1; 0 is untinted, 1 is flat colour
